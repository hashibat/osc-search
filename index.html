<style>
:root{

  --win:#34c759; --lose:#ff3b30; --draw:#ff9500; --chip:rgba(118,118,128,.12);

}
@media (prefers-color-scheme: dark){

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);

.wrap{max-width:640px;margin:0 auto;padding:14px 16px 40px;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:var(--blur);

  border-bottom:.5px solid var(--line)}
h1{font-size:28px;font-weight:700;margin:0 0 2px;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--muted);margin:0 0 10px}
.searchbox{position:relative}
input[type=search]{width:100%;padding:9px 36px 9px 12px;font-size:17px;border-radius:10px;

input[type=search]::placeholder{color:var(--muted)}
input[type=search]:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;
  color:var(--muted);font-size:20px;padding:4px 8px;cursor:pointer;display:none}
.sugg{list-style:none;margin:8px 0 0;padding:4px;background:var(--card);
  border-radius:14px;max-height:44vh;overflow:auto;display:none;box-shadow:0 8px 28px rgba(0,0,0,.14)}
.sugg li{padding:10px 12px;border-radius:10px;cursor:pointer;font-size:16px}
.sugg li:active,.sugg li.hi{background:var(--chip)}
.sugg .cnt{float:right;color:var(--muted);font-size:13px}
.hint{color:var(--muted);font-size:13px;margin:16px 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 14px}
.chip{background:var(--card);border:0;border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;
  color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.chip:active{opacity:.55}
.section{margin:0 0 24px}
.section>h2{font-size:20px;font-weight:700;margin:0 0 10px 4px;color:var(--text);display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.section>h2 .n{background:var(--chip);color:var(--muted);border-radius:999px;font-size:12px;padding:1px 9px;font-weight:600}
.summary{background:var(--card);border-radius:14px;padding:12px 14px;margin:0 0 10px;font-size:14px;color:var(--muted);
  box-shadow:0 1px 2px rgba(0,0,0,.04)}
.summary b{font-size:17px;color:var(--text)}
.rec{background:var(--card);border-radius:14px;padding:12px 14px;margin:0 0 10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.rec .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.rec .date{color:var(--muted);font-size:12.5px;white-space:nowrap}
.rec .meta{color:var(--muted);font-size:12.5px}
.match{display:flex;align-items:center;gap:8px;font-size:16px}
.match .t{flex:1;min-width:0}
.match .t.r{text-align:right}
.match .sc{font-weight:700;font-variant-numeric:tabular-nums;font-size:18px;white-space:nowrap;padding:0 2px}
.hl{color:var(--accent);font-weight:600}
.badge{display:inline-block;min-width:22px;text-align:center;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;color:#fff}
.b-W{background:var(--win)} .b-L{background:var(--lose)} .b-D{background:var(--draw)}
.pk{color:var(--draw);font-size:12px;margin-left:6px}
.win-tag{color:var(--accent);font-size:12.5px}
.note{color:var(--muted);font-size:12.5px;margin-top:8px;border-top:.5px solid var(--line);padding-top:6px}
table.st{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;
  background:var(--card);border-radius:14px;overflow:hidden}
table.st th,table.st td{padding:8px 5px;border-bottom:.5px solid var(--line);text-align:center}
table.st th{color:var(--muted);font-weight:600}
table.st td.name{text-align:left}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:15px}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:24px;line-height:1.7;white-space:pre-line}
</style>
</head>

/* ---------- normalize ---------- */
function normalize(s){
  if(s==null) return "";
  s = String(s).normalize("NFKC").toLowerCase();
  // katakana -> hiragana
  s = s.replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0)-0x60));
  // drop dakuten / handakuten so \u304c=\u304b, \u3070=\u306f=\u3071 (typo tolerance)
  s = s.normalize("NFD").replace(/[\u3099\u309a]/g, "").normalize("NFC");
  // strip separators / spaces / long vowel etc.
  s = s.replace(/[\s\u3000・.．,，\-‐-‒–—ー_()（）]/g, "");
  return s;
}

function addTeam(name){
  if(!name) return;
  const n = normalize(name);
  if(!n) return;
  if(!teamCount.has(n)) teamCount.set(n,{display:name,count:0});
  teamCount.get(n).count++;
}
DATA.league.forEach(r=>{addTeam(r.home);addTeam(r.away);});
DATA.tour.forEach(r=>{addTeam(r.home);addTeam(r.away);});
DATA.standings.forEach(r=>addTeam(r.team));
DATA.own.forEach(r=>addTeam(r.opponent));

const TEAMS = [...teamCount.entries()].map(([n,v])=>({norm:n,display:v.display,count:v.count}))
  .sort((a,b)=> b.count-a.count || a.display.localeCompare(b.display,'ja'));

/* ---------- matching ---------- */
function bigrams(s){const a=[];for(let i=0;i<s.length-1;i++)a.push(s.slice(i,i+2));return a;}
function dice(a,b){
  if(a===b) return 1;
  if(a.length<2||b.length<2) return a.length&&b.length&&(a.includes(b)||b.includes(a))?0.6:0;
  const A=bigrams(a),B=bigrams(b);const m=new Map();A.forEach(g=>m.set(g,(m.get(g)||0)+1));
  let inter=0;B.forEach(g=>{if(m.get(g)>0){inter++;m.set(g,m.get(g)-1);}});
  return (2*inter)/(A.length+B.length);
}
// return matched team objects for a query, scored.
// substring matches take priority; typo/similarity fallback only when nothing matches.
function matchTeams(query){
  const nq = normalize(query);
  if(!nq) return [];
  const solid=[], fuzzy=[];
  for(const t of TEAMS){
    if(t.norm===nq) solid.push({...t,score:100});
    else if(t.norm.startsWith(nq)) solid.push({...t,score:90 - (t.norm.length-nq.length)*0.5});
    else if(t.norm.includes(nq)) solid.push({...t,score:75 - (t.norm.length-nq.length)*0.4});
    else if(nq.length>=2 && nq.includes(t.norm)) solid.push({...t,score:70});
    else { const d=dice(nq,t.norm); if(d>=0.5) fuzzy.push({...t,score:d*60}); }
  }
  const out = solid.length ? solid : fuzzy;   // only fall back to fuzzy typo matching
  out.sort((a,b)=> b.score-a.score || b.count-a.count);
  return out;
}

/* ---------- rendering helpers ---------- */
const $ = s=>document.querySelector(s);
const esc = s=> String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function teamCell(name, matchedSet, right){
  const on = matchedSet.has(normalize(name));
  return `<span class="t${right?' r':''}">${on?'<span class="hl">'+esc(name)+'</span>':esc(name)}</span>`;
}
function scoreMatch(home,hs,as,away,matchedSet,extraHtml){
  return `<div class="match">
    ${teamCell(home,matchedSet,false)}
    <span class="sc">${esc(hs)} - ${esc(as)}</span>
    ${teamCell(away,matchedSet,true)}
  </div>${extraHtml||""}`;
}

/* 新しい日付が上。日付は YYYY/MM/DD または M/D。同日はデータ順の逆(後の試合が上) */
function dkey(d){const p=String(d||"").split("/").map(Number);return p.length>=3?p[0]*10000+p[1]*100+p[2]:(p[0]||0)*100+(p[1]||0);}
function newestFirst(rows){return rows.map((r,i)=>[r,i]).sort((a,b)=>dkey(b[0].date)-dkey(a[0].date)||b[1]-a[1]).map(x=>x[0]);}

/* ---------- main render ---------- */
function render(query){
  const res = $("#results");
  const matched = matchTeams(query);
  const ownSearch = isOwn(normalize(query)) || matched.some(m=>isOwn(m.norm));

  if(matched.length===0 && !ownSearch){
    res.innerHTML = `<div class="empty">「${esc(query)}」に一致するチームが見つかりませんでした。<br>別の表記で試してください。</div>`;
    return;
  }
  const matchedSet = new Set(matched.map(m=>m.norm));
  const inSet = name => matchedSet.has(normalize(name));

  let html = "";

  // matched teams chips
  if(matched.length){
    html += `<div style="margin:2px 0 14px"><span class="hint" style="margin:0 0 6px;display:block">一致したチーム:</span><div class="chips">`
      + matched.slice(0,10).map(m=>`<span class="chip" data-team="${esc(m.display)}">${esc(m.display)}</span>`).join("")
      + `</div></div>`;
  }

  /* --- A. 大曽根 対戦履歴 --- */
  let ownRows = newestFirst(DATA.own.filter(r=> ownSearch ? true : inSet(r.opponent)));
  if(ownRows.length){
    const w=ownRows.filter(r=>r.result==="W").length;
    const l=ownRows.filter(r=>r.result==="L").length;
    const d=ownRows.filter(r=>r.result==="D").length;
    const gf=ownRows.reduce((s,r)=>s+(+r.osone_GF||0),0);
    const ga=ownRows.reduce((s,r)=>s+(+r.osone_GA||0),0);
    html += `<div class="section"><h2>🟢 大曽根SC の対戦履歴 <span class="n">${ownRows.length}試合</span></h2>`;
    html += `<div class="summary"><b>${w}勝 ${d}分 ${l}敗</b> ／ 得点 ${gf}・失点 ${ga}${ownSearch?' （大曽根の全戦績）':''}</div>`;
    ownRows.forEach(r=>{
      const res=r.result||"";
      html += `<div class="rec">
        <div class="top"><span class="meta">${esc(r.grade)} ・ ${esc(r.tournament)}</span><span class="date">${esc(r.date)}</span></div>
        <div class="match">
          <span class="t">大曽根SC</span>
          <span class="sc">${esc(r.osone_GF)} - ${esc(r.osone_GA)}</span>
          <span class="t r">${inSet(r.opponent)?'<span class="hl">'+esc(r.opponent)+'</span>':esc(r.opponent)}</span>
        </div>
        <div style="text-align:right;margin-top:6px"><span class="badge b-${esc(res)}">${esc(res)}</span></div>
        ${r.note?`<div class="note">${esc(r.note)}</div>`:""}
      </div>`;
    });
    html += `</div>`;
  }

  /* --- B. リーグ戦 (57回) --- */
  let lg = newestFirst(DATA.league.filter(r=> inSet(r.home)||inSet(r.away)));
  if(lg.length){
    html += `<div class="section"><h2>📋 第57回大会 リーグ戦 <span class="n">${lg.length}試合</span></h2>`;
    lg.forEach(r=>{
      html += `<div class="rec">
        <div class="top"><span class="meta">${esc(r.block)}</span><span class="date">${esc(r.date)}</span></div>
        ${scoreMatch(r.home,r.home_score,r.away_score,r.away,matchedSet)}
      </div>`;
    });
    html += `</div>`;
  }

  /* --- C. トーナメント (57回) --- */
  let tr = newestFirst(DATA.tour.filter(r=> inSet(r.home)||inSet(r.away)));
  if(tr.length){
    html += `<div class="section"><h2>🏆 第57回大会 トーナメント <span class="n">${tr.length}試合</span></h2>`;
    tr.forEach(r=>{
      const pk = r.pk?`<span class="pk">PK ${esc(r.pk)}</span>`:"";
      const win = r.winner?`<div style="text-align:right;margin-top:5px"><span class="win-tag">勝: ${esc(r.winner)}</span>${pk}</div>`:"";
      html += `<div class="rec">
        <div class="top"><span class="meta">${esc(r.division)} ・ ${esc(r.round)}</span><span class="date">${esc(r.date)}</span></div>
        ${scoreMatch(r.home,r.home_score,r.away_score,r.away,matchedSet)}
        ${win}
      </div>`;
    });
    html += `</div>`;
  }

  /* --- D. 順位表 (57回) --- */
  let st = DATA.standings.filter(r=> inSet(r.team));
  if(st.length){
    html += `<div class="section"><h2>📊 第57回大会 リーグ順位 <span class="n">${st.length}件</span></h2>`;
    html += `<table class="st"><thead><tr><th>ブロック</th><th>順位</th><th class="name" style="text-align:left">チーム</th><th>勝</th><th>分</th><th>敗</th><th>点</th><th>得</th><th>失</th><th>差</th></tr></thead><tbody>`;
    st.forEach(r=>{
      html += `<tr><td>${esc(r.block)}</td><td>${esc(r.rank)}</td><td class="name">${inSet(r.team)?'<span class="hl">'+esc(r.team)+'</span>':esc(r.team)}</td>
        <td>${esc(r.W)}</td><td>${esc(r.D)}</td><td>${esc(r.L)}</td><td>${esc(r.points)}</td><td>${esc(r.GF)}</td><td>${esc(r.GA)}</td><td>${esc(r.GD)}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  }

  if(!ownRows.length && !lg.length && !tr.length && !st.length){
    html += `<div class="empty">一致するチームはありましたが、試合データは見つかりませんでした。</div>`;
  }
  res.innerHTML = html;
  res.querySelectorAll(".chip[data-team]").forEach(c=>{
    c.addEventListener("click",()=>{ setQuery(c.dataset.team); });
  });
  window.scrollTo({top:0,behavior:"instant"});
}

/* ---------- suggestions ---------- */
const qEl=$("#q"), suggEl=$("#sugg"), clrEl=$("#clr"), before=$("#beforeSearch");
let hiIdx=-1, curSugg=[];
function showSugg(query){
  const m = matchTeams(query).slice(0,12);
  curSugg=m; hiIdx=-1;
  if(!query || m.length===0){ suggEl.style.display="none"; suggEl.innerHTML=""; return; }
  suggEl.innerHTML = m.map((t,i)=>`<li data-i="${i}" data-team="${esc(t.display)}">${esc(t.display)}<span class="cnt">${t.count}件</span></li>`).join("");
  suggEl.style.display="block";
  suggEl.querySelectorAll("li").forEach(li=>{
    li.addEventListener("click",()=>setQuery(li.dataset.team));
  });
}
function setQuery(name){
  qEl.value=name; suggEl.style.display="none"; clrEl.style.display="block";
  before.style.display="none";
  render(name); qEl.blur();
}
qEl.addEventListener("input",()=>{
  const v=qEl.value.trim();
  clrEl.style.display=v?"block":"none";
  if(v){ before.style.display="none"; showSugg(v); render(v); }
  else{ suggEl.style.display="none"; before.style.display="block"; $("#results").innerHTML=""; }
});
qEl.addEventListener("keydown",e=>{
  if(suggEl.style.display!=="block") return;
  const lis=[...suggEl.querySelectorAll("li")];
  if(e.key==="ArrowDown"){e.preventDefault();hiIdx=Math.min(hiIdx+1,lis.length-1);}
  else if(e.key==="ArrowUp"){e.preventDefault();hiIdx=Math.max(hiIdx-1,0);}
  else if(e.key==="Enter"){ if(hiIdx>=0&&curSugg[hiIdx]){e.preventDefault();setQuery(curSugg[hiIdx].display);} else {suggEl.style.display="none";} return;}
  else return;
  lis.forEach((li,i)=>li.classList.toggle("hi",i===hiIdx));
});
clrEl.addEventListener("click",()=>{qEl.value="";clrEl.style.display="none";suggEl.style.display="none";before.style.display="block";$("#results").innerHTML="";qEl.focus();});
document.addEventListener("click",e=>{ if(!e.target.closest(".searchbox")) suggEl.style.display="none"; });

/* quick chips: top teams by appearance */
const quick = TEAMS.slice(0,12);
$("#quickchips").innerHTML = quick.map(t=>`<span class="chip" data-team="${esc(t.display)}">${esc(t.display)}</span>`).join("");
$("#quickchips").querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>setQuery(c.dataset.team)));

$("#foot").textContent = `収録: 大曽根戦績 ${DATA.own.length}試合 / リーグ ${DATA.league.length}試合 / トーナメント ${DATA.tour.length}試合 / 順位 ${DATA.standings.length}件
Build: ${DATA.build} ・ Latest match: ${DATA.latest}`;
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(e){console.log('SW registration failed',e);});});}</script>

<style>
#a2hsBtn{display:none;margin-left:auto;border:0;border-radius:999px;background:var(--chip);color:var(--accent);font-size:13px;font-weight:600;padding:6px 12px;cursor:pointer;white-space:nowrap}
#a2hsBtn:active{opacity:.55}
#a2hsBtn.txt{background:none;color:var(--muted);font-weight:400;padding:6px 0;cursor:default;opacity:1}
.titlerow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
</style>
<script>
(function(){
  var btn=document.getElementById('a2hsBtn');
  var ua=navigator.userAgent;
  var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  // ?debug=1 のときだけ判定結果を画面下に表示(LINE内の動作確認用)
  if(/[?&]debug=1/.test(location.search)){
    var yn=function(v){return v?'yes':'no'};
    var dbg=document.createElement('div'); dbg.id='a2hsDebug';
    dbg.style.cssText='margin-top:8px;word-break:break-all;text-align:left';
    document.getElementById('foot').appendChild(dbg);
    var put=function(inst){ dbg.textContent='UA: '+ua+'\nLINE判定: '+yn(/\bLine\//i.test(ua))+' ・ アプリ判定: '+yn(standalone)+' ・ インストール済み判定: '+inst; };
    put('確認中');
    if(navigator.getInstalledRelatedApps) navigator.getInstalledRelatedApps().then(function(a){put(yn(a&&a.length))},function(){put('取得失敗')});
    else put('非対応');
  }
  var isIOS=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  var isAndroid=/Android/i.test(ua), isLine=/\bLine\//i.test(ua);
  var extUrl=location.origin+location.pathname+'?openExternalBrowser=1';
  function asButton(label,fn){ btn.textContent=label; btn.className=''; btn.disabled=false; btn.onclick=fn; btn.style.display='inline-block'; }
  function asText(label){ btn.textContent=label; btn.className='txt'; btn.disabled=true; btn.onclick=null; btn.style.display='inline-block'; }
  function gone(){ btn.style.display='none'; }

  if(isLine){
    // LINEのブラウザでは追加できない → 標準ブラウザへ自動で移動。移動できないときだけボタンを出す
    if(!/[?&](openExternalBrowser|debug)=1/.test(location.search)){ location.replace(extUrl); return; }
    asButton(isIOS?'Safariで開く':'Chromeで開く',function(){ location.href=extUrl; });
    return;
  }
  if(standalone) return;                       // ホーム画面のアプリ → 何も出さない
  if(isIOS){ asText('共有ボタン→ホーム画面に追加'); return; }   // サイトからは追加できない
  if(!isAndroid) return;                       // PC → 何も出さない

  var deferred=null, checked=false, installed=false;
  function render(){
    if(!checked||installed) return;
    if(deferred) asButton('インストール',function(){
      var d=deferred; deferred=null;
      d.prompt(); d.userChoice.then(function(r){ if(r&&r.outcome==='accepted'){ installed=true; gone(); } else render(); });
    });
    else asText('メニュー(︙)から追加');
  }
  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferred=e; render(); });
  window.addEventListener('appinstalled',function(){ installed=true; gone(); });
  var chk=navigator.getInstalledRelatedApps?navigator.getInstalledRelatedApps():Promise.resolve([]);
  chk.then(function(a){ installed=!!(a&&a.length); },function(){}).then(function(){ checked=true; render(); });
})();
</script>
</body>
